name: KoharuPad
configs:
  Staging: debug
  StagingRelease: release
  Production: release
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    exactVersion: 13.11.0
  GoogleUMP:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    exactVersion: 3.1.0
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 13.1.1
  ONNXRuntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    exactVersion: 1.24.2
options:
  defaultConfig: Staging
  bundleIdPrefix: com.kurubyInteractive
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    PRODUCT_BUNDLE_IDENTIFIER: com.kurubyInteractive.aimanga
    DEVELOPMENT_TEAM: 6B86Z886QA
    KOHARU_ADMOB_APP_ID: ca-app-pub-9623603115892772~2803757650
    KOHARU_REWARDED_AD_UNIT: ca-app-pub-9623603115892772/3441604792
    KOHARU_ADS_TESTING: 'NO'
    KOHARU_BUNDLE_SUFFIX: ''
    # Base64 raw Ed25519 public key. When set, remote app-config.json must be
    # signed (scripts/sign_config.py). Empty keeps unsigned remote configuration.
    KOHARU_CONFIG_SIGNING_KEY: ''
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  configs:
    Staging:
      KOHARU_ADS_TESTING: YES
      KOHARU_BUNDLE_SUFFIX: .staging
      KOHARU_ENVIRONMENT: staging
      KOHARU_DISPLAY_NAME: AI Anime Translator Staging
      PRODUCT_BUNDLE_IDENTIFIER: com.kurubyInteractive.aimanga.staging
      KOHARU_APNS_ENVIRONMENT: development
    StagingRelease:
      KOHARU_ADS_TESTING: YES
      KOHARU_BUNDLE_SUFFIX: .staging
      KOHARU_ENVIRONMENT: staging
      KOHARU_DISPLAY_NAME: AI Anime Translator Staging
      PRODUCT_BUNDLE_IDENTIFIER: com.kurubyInteractive.aimanga.staging
      KOHARU_APNS_ENVIRONMENT: production
    Production:
      KOHARU_ENVIRONMENT: production
      KOHARU_DISPLAY_NAME: AI Anime Translator
      PRODUCT_BUNDLE_IDENTIFIER: com.kurubyInteractive.aimanga
      KOHARU_APNS_ENVIRONMENT: production
targetTemplates:
  App:
    type: application
    platform: iOS
    dependencies:
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: GoogleUMP
        product: GoogleUserMessagingPlatform
      - package: Firebase
        product: FirebaseAnalyticsCore
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebaseRemoteConfig
      - package: ONNXRuntime
        product: onnxruntime
      - framework: Vendor/sd-native/stable_diffusion.xcframework
        embed: true
    sources:
      - Sources
      - Resources
      - path: ../../crates/koharu-translator/src/translation-system.txt
        buildPhase: resources
      - path: ../../packages/bridge/src/rawkuma-navigation.js
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: KoharuPad
        INFOPLIST_FILE: Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Sources/VisionNative.h
        CLANG_CXX_LANGUAGE_STANDARD: c++17
    preBuildScripts:
      - name: Validate shared authentication backend
        script: |
          set -eu
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          resources = Path(os.environ['SRCROOT']) / 'Resources'
          config = json.loads((resources / 'nakama-connection.json').read_text())
          if set(config) != {'server_key', 'credential_namespace', 'apple_bundle_ids'} or os.environ['PRODUCT_BUNDLE_IDENTIFIER'] not in config['apple_bundle_ids'] or not (resources / 'nakama-connection.cer').is_file():
              raise SystemExit('Missing shared authentication configuration for this Bundle ID')
          PY
        inputFiles: ['$(SRCROOT)/Resources/nakama-connection.json', '$(SRCROOT)/Resources/nakama-connection.cer']
        basedOnDependencyAnalysis: false
      - name: Select Firebase environment
        script: |
          set -eu
          source_plist="$SRCROOT/Firebase/$KOHARU_ENVIRONMENT/GoogleService-Info.plist"
          firebase_bundle=$(/usr/libexec/PlistBuddy -c 'Print BUNDLE_ID' "$source_plist")
          if [ "$firebase_bundle" != "$PRODUCT_BUNDLE_IDENTIFIER" ]; then
            echo "error: Firebase configuration does not match the app Bundle ID."
            exit 1
          fi
          mkdir -p "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          cp "$source_plist" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/GoogleService-Info.plist"
        inputFiles: ['$(SRCROOT)/Firebase/$(KOHARU_ENVIRONMENT)/GoogleService-Info.plist']
        outputFiles: ['$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist']
        basedOnDependencyAnalysis: false

targets:
  KoharuPad:
    templates: [App]
    attributes:
      SystemCapabilities:
        com.apple.InAppPurchase:
          enabled: 1
        com.apple.Push:
          enabled: 1
        com.apple.SignInWithApple:
          enabled: 1
    settings:
      base:
        FRAMEWORK_SEARCH_PATHS: '$(inherited) $(PROJECT_DIR)/Vendor/build-apple/llama.xcframework/ios-arm64'
        CODE_SIGN_ENTITLEMENTS: KoharuPad.entitlements
        OTHER_LDFLAGS: '$(inherited) -framework llama -lc++'
    postBuildScripts:
      - name: Embed llama runtime
        script: |
          set -eu
          mkdir -p "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH"
          ditto "$PROJECT_DIR/Vendor/build-apple/llama.xcframework/ios-arm64/llama.framework" "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/llama.framework"
          if [ "$CODE_SIGNING_ALLOWED" = YES ] && [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
            codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/llama.framework"
          fi
      - name: Upload Crashlytics symbols
        script: |
          set -eu
          if [ "$CONFIGURATION" = Staging ]; then exit 0; fi
          "$SRCROOT/Vendor/Packages/checkouts/firebase-ios-sdk/Crashlytics/run"
        inputFiles:
          - '$(DWARF_DSYM_FOLDER_PATH)/$(DWARF_DSYM_FILE_NAME)'
          - '$(DWARF_DSYM_FOLDER_PATH)/$(DWARF_DSYM_FILE_NAME)/Contents/Resources/DWARF/$(PRODUCT_NAME)'
          - '$(DWARF_DSYM_FOLDER_PATH)/$(DWARF_DSYM_FILE_NAME)/Contents/Info.plist'
          - '$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist'
          - '$(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)'
        basedOnDependencyAnalysis: false
  KoharuPadSimulator:
    templates: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kurubyInteractive.aimanga$(KOHARU_BUNDLE_SUFFIX)
        CODE_SIGN_ENTITLEMENTS: KoharuPadSimulator.entitlements
  KoharuPadTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: KoharuPadSimulator
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.kurubyInteractive.aimanga.tests
        TEST_HOST: '$(BUILT_PRODUCTS_DIR)/KoharuPad.app/KoharuPad'
        BUNDLE_LOADER: '$(TEST_HOST)'
  KoharuPadDeviceChecks:
    type: bundle.unit-test
    platform: iOS
    sources:
      - DeviceChecks
      - Tests/HostedProviderTests.swift
    dependencies:
      - target: KoharuPad
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.kurubyInteractive.aimanga.devicechecks
        FRAMEWORK_SEARCH_PATHS: '$(inherited) $(PROJECT_DIR)/Vendor/build-apple/llama.xcframework/ios-arm64'
        TEST_HOST: '$(BUILT_PRODUCTS_DIR)/KoharuPad.app/KoharuPad'
        BUNDLE_LOADER: '$(TEST_HOST)'
schemes:
  KoharuPadStaging:
    build:
      targets:
        KoharuPad: all
    run:
      config: Staging
    archive:
      config: StagingRelease
    test:
      config: Staging
      targets: [KoharuPadDeviceChecks]
  KoharuPadProduction:
    build:
      targets:
        KoharuPad: all
    run:
      config: Production
    archive:
      config: Production
  KoharuPadSimulatorStaging:
    build:
      targets:
        KoharuPadSimulator: all
    run:
      config: Staging
    test:
      config: Staging
      targets: [KoharuPadTests]
  KoharuPadSimulatorProduction:
    build:
      targets:
        KoharuPadSimulator: all
    run:
      config: Production
