[package]
name = "koharu-android-core"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Built only by the Android Gradle build; kept out of the desktop workspace.
[workspace]

[lib]
name = "koharu_core"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
futures = "0.3.34"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
scraper = "0.29.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
thiserror = "2"
tokio = { version = "1.54.1", features = ["time"] }
uniffi = { version = "0.32", features = ["tokio"] }
url = "2.5.8"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true

[build-dependencies]
cc = "1.11.1"
